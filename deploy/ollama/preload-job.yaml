# Post-deploy model preload (spec 02). Idempotent: `ollama pull` skips layers already on the PVC.
# Pulls by tag (never latest) in an init container that uses the ollama CLI. The warm-up requests run in a
# separate pinned curl container, because the ollama image has neither curl nor wget.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-preload
  namespace: ollama
  annotations:
    # A Job's pod template is immutable, so editing the model list would make Flux fail the apply. Let Flux
    # delete and recreate this one resource when that happens (the pull is idempotent).
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: pull
          image: docker.io/ollama/ollama:0.40.16
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ollama.svc:11434
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 5; done
              for m in qwen3.5:9b nomic-embed-text:v1.5 qwen2.5vl:3b; do
                echo "pulling $m"
                ollama pull "$m"
              done
      containers:
        - name: warm
          image: docker.io/curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "warming embedding model (pinned resident)"
              curl -sf -H 'Content-Type: application/json' \
                -d '{"model":"nomic-embed-text:v1.5","input":"warmup","keep_alive":-1}' \
                http://ollama.ollama.svc:11434/api/embed >/dev/null
              echo "warming chat model (qwen3.5:9b)"
              curl -sf -H 'Content-Type: application/json' \
                -d '{"model":"qwen3.5:9b","prompt":"ok","stream":false,"think":false,"options":{"num_predict":1}}' \
                http://ollama.ollama.svc:11434/api/generate >/dev/null
              echo "preload complete"
