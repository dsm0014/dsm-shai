{
  "storage": {
    "workspace": "/app/.openviking/openviking_workspace",
    "vectordb": {"name": "context", "backend": "local", "project": "default"},
    "agfs": {"backend": "local", "timeout": 10}
  },
  "log": {"level": "INFO", "output": "stdout"},
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "workers": 1,
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "cors_origins": ["*"]
  },
  "embedding": {
    "dense": {
      "api_base": "http://litellm.litellm.svc:4000/v1",
      "api_key": "${OPENVIKING_LITELLM_KEY}",
      "provider": "openai",
      "model": "embed",
      "dimension": 768
    },
    "max_concurrent": 10
  },
  "vlm": {
    "api_base": "http://litellm.litellm.svc:4000/v1",
    "api_key": "${OPENVIKING_LITELLM_KEY}",
    "provider": "openai",
    "model": "vision",
    "temperature": 0.0,
    "max_retries": 0,
    "thinking": false,
    "max_concurrent": 4
  }
}
