# Daily check for failed memory extractions (2026-11-25). OpenViking writes a .failed.json next to each session whose memory
# extraction failed and never retries it. This job mounts the data volume read-only and counts the failures from the last
# 24 hours. It exits non-zero when there are any, so the Job shows as failed in `kubectl get jobs`.
# Runs on the node that holds the openviking-data volume (local-path, ReadWriteOnce).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openviking-extraction-watch
  namespace: openviking
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openviking-extraction-watch
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: count
              image: ghcr.io/volcengine/openviking:v0.5.5@sha256:d0d6d5c2dad366b81d970caf420ce186723e539ffc781b80620298675ea5accc
              command:
                - sh
                - -c
                - |
                  n=$(find /app/.openviking/openviking_workspace/viking -name .failed.json -mtime -1 2>/dev/null | wc -l)
                  echo "openviking-extraction: $n failed memory extraction(s) in the last 24h"
                  [ "$n" -eq 0 ]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /app/.openviking
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: openviking-data
                readOnly: true
