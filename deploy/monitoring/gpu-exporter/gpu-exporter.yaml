# GPU and Ollama metrics exporter (spec 06 fallback for DCGM). Runs on the nvidia runtime to see the GPU.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gpu-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-exporter
    spec:
      serviceAccountName: gpu-exporter
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/litellm/litellm:1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
          command: ["python3", "-u", "/opt/exporter/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9400
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            - name: OLLAMA_URL
              value: http://ollama.ollama.svc:11434
            - name: SCRAPE_INTERVAL
              value: "15"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 60
          volumeMounts:
            - name: exporter
              mountPath: /opt/exporter
              readOnly: true
      volumes:
        - name: exporter
          configMap:
            name: gpu-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gpu-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpu-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
