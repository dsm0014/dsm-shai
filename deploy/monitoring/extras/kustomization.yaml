apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - alerts.yaml
  - grafana-route.yaml
configMapGenerator:
  - name: dsm-dashboard-gpu-ollama
    files:
      - dashboards/gpu-ollama.json
    options:
      labels: {grafana_dashboard: "1"}
  - name: dsm-dashboard-workloads-node
    files:
      - dashboards/workloads-node.json
    options:
      labels: {grafana_dashboard: "1"}
