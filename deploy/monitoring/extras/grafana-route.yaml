# Grafana through the Istio ingress gateway, host-local (spec 06 / spec 05 pattern). Route lives with the mesh gateway.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["grafana.localhost"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: monitoring
spec:
  hosts: ["grafana.localhost"]
  gateways: ["monitoring/grafana"]
  http:
    - route:
        - destination:
            host: kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            port: {number: 80}
