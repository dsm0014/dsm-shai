apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m   # the chart index is large and the link is slow; the 1m default timed out and blocked every Flux stage after monitoring
  url: https://prometheus-community.github.io/helm-charts
