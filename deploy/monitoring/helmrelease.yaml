# Spec 06 part A: Prometheus Operator (+ CRDs), Prometheus, Grafana, node-exporter, kube-state-metrics.
# Alertmanager and control-plane scrapes are off: k3s does not expose etcd/scheduler/controller-manager metrics.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0 # pinned; bump deliberately
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
    alertmanager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheusOperator:
      podLabels:
        # Spec 08 exception: the kube-apiserver calls this pod's admission webhook from outside the mesh.
        # Under STRICT mTLS those calls would be refused, so the operator pod stays out of ambient.
        istio.io/dataplane-mode: none
    prometheus:
      prometheusSpec:
        retention: 14d
        retentionSize: 20GB
        # Pick up ServiceMonitors and PodMonitors from every namespace, not only the Helm-labelled ones.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi
    prometheus-node-exporter:
      # WSL2's root mount is not a shared mount, so the hostRootfs bind (mountPropagation) fails with
      # 'not a shared or slave mount'. Disabled here; other node metrics are still collected.
      # Making / shared needs root on the host (`mount --make-rshared /`); not done, so not required.
      hostRootFsMount:
        enabled: false
    grafana:
      # Admin credentials come from the SOPS-encrypted Secret applied by the `secrets` stage.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      resources:
        limits:
          memory: 512Mi
