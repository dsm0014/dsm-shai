# Host-local ingress for Open WebUI through the Istio ingress gateway (spec 05). Only Open WebUI is routed here.
# The gateway Service stays ClusterIP; reach it from the host with a loopback port-forward (see README).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: open-webui
  namespace: open-webui
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - open-webui.localhost
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: open-webui
  namespace: open-webui
spec:
  hosts:
    - open-webui.localhost
  gateways:
    - open-webui/open-webui
  http:
    - route:
        - destination:
            host: open-webui.open-webui.svc.cluster.local
            port:
              number: 8080
