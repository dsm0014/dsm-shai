# Open WebUI egress (spec 05): cluster DNS, LiteLLM (4000) and the ambient HBONE tunnel only. Everything else, including
# direct Ollama and the public internet, is refused. Ingress is already limited by the Istio policy (spec 08).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-egress
  namespace: open-webui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: litellm}
      ports:
        - {protocol: TCP, port: 4000}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 15008}
