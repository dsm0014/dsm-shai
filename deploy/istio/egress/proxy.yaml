# Forward proxy (Squid) for spec 11. The image is pinned by digest. The config and these pod restrictions were checked
# in Docker on 2026-11-17 (parse, start, allow and deny). Not yet verified in the cluster (README, "Verify before use").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  namespace: egress-proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  namespace: egress-proxy
  labels: {app.kubernetes.io/name: squid}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: squid}
  template:
    metadata:
      labels: {app.kubernetes.io/name: squid}
    spec:
      serviceAccountName: egress-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13            # "proxy" user in the Ubuntu image
        runAsGroup: 13
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: squid
          image: docker.io/ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
          imagePullPolicy: IfNotPresent
          command: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
          ports:
            - {name: proxy, containerPort: 3128}
            - {name: research, containerPort: 3129}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 10
          volumeMounts:
            - {name: conf, mountPath: /etc/squid/squid.conf, subPath: squid.conf, readOnly: true}
            - {name: spool, mountPath: /var/spool/squid}
            - {name: log, mountPath: /var/log/squid}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap: {name: squid-config}
        - {name: spool, emptyDir: {sizeLimit: 64Mi}}
        - {name: log, emptyDir: {sizeLimit: 64Mi}}
        - {name: run, emptyDir: {sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: squid
  namespace: egress-proxy
  labels: {app.kubernetes.io/name: squid}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: squid}
  ports:
    - {name: proxy, port: 3128, targetPort: proxy}
    - {name: research, port: 3129, targetPort: research}
