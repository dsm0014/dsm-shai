# Egress proxy for the Hermes pod (specs 11 and 12). Only CONNECT on 443 to the five GitHub hosts and api.anthropic.com
# (the Claude Code CLI, subscription auth) is allowed.
# The allowlist is on the CONNECT target hostname (works on any Squid build). SNI inspection (ssl_bump peek/splice)
# needs an OpenSSL build of Squid; see deploy/istio/egress/README.md. Squid resolves and dials the allowed host itself,
# so a client that sends a different SNI still reaches only GitHub's servers.
http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT
acl github_hosts dstdomain github.com api.github.com codeload.github.com raw.githubusercontent.com objects.githubusercontent.com
acl claude_hosts dstdomain api.anthropic.com
http_access allow CONNECT SSL_ports github_hosts
http_access allow CONNECT SSL_ports claude_hosts
http_access deny all
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
via off
forwarded_for delete
shutdown_lifetime 3 seconds
