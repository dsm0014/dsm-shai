apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-test
  namespace: platform-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-test-writer
  namespace: platform-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: writer
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "echo persisted > /data/marker"]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pvc-test}
