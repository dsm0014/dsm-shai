apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke-test
  namespace: platform-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: nvidia-smi
          image: docker.io/nvidia/cuda:13.0.2-base-ubuntu24.04
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: 1
