# Hermes Agent (spec 04). Upstream image pinned by tag and digest. Image is not built locally (see README).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-home
  namespace: hermes
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: false
      initContainers:
        - name: seed-config
          image: docker.io/nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "chown 10000:10000 /opt/data && chmod 0750 /opt/data && cp /config/config.yaml /opt/data/config.yaml && chown 10000:10000 /opt/data/config.yaml && echo seeded"]
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000                       # hermes user in the image
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: dsm-shai/hermes:v0.23.1-1     # spec 12: upstream plus the Claude Code CLI; built by scripts/build-hermes-image.sh (no registry)
          imagePullPolicy: IfNotPresent
          # Skip the s6 /init (root PID 1). The init container has already set ownership and seeded config.
          command: ["/opt/hermes/docker/main-wrapper.sh"]
          args: ["gateway", "run"]             # headless: long-lived foreground gateway (recommended for containers)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true       # tested 2026-11-16: only /tmp, /opt/data and /workspace are written
            capabilities:
              drop: ["ALL"]
          env:
            - name: LITELLM_HERMES_KEY          # read via model.key_env in config.yaml
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: litellm-key
            - name: OPENVIKING_KEY              # ${OPENVIKING_KEY} in mcp_servers headers (config.yaml)
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openviking-key
            - name: GITHUB_TOKEN                # spec 11: optional, so the pod starts without it; the job fails closed
              valueFrom:
                secretKeyRef:
                  name: hermes-github
                  key: token
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN     # spec 12: subscription token for the Claude Code CLI; no API key anywhere
              valueFrom:
                secretKeyRef:
                  name: hermes-claude
                  key: oauth-token
                  optional: true
            - {name: CLAUDE_CONFIG_DIR, value: /opt/data/claude}
            - {name: DISABLE_AUTOUPDATER, value: "1"}
            - {name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1"}
            - name: NIGHTLY_HTTPS_PROXY         # kept for the job wrapper, which exports HTTPS_PROXY from it
              value: "http://squid.egress-proxy.svc:3128"
            # The whole pod, interactive Hermes and its tools included, reaches the internet only through the egress proxy
            # (its five GitHub hosts; everything else is refused). Cluster-internal hosts (LiteLLM, OpenViking) stay direct.
            - name: HTTPS_PROXY
              value: "http://squid.egress-proxy.svc:3128"
            - name: https_proxy
              value: "http://squid.egress-proxy.svc:3128"
            # git identity and push auth for the terminal tool. The credential helper reads GITHUB_TOKEN at call time, so the
            # token is never written to disk (HOME is the PVC). There is no gh in the image: PRs go through the REST API (curl).
            - {name: GIT_AUTHOR_NAME, value: "Hermes (dsm-shai)"}
            - {name: GIT_COMMITTER_NAME, value: "Hermes (dsm-shai)"}
            - {name: GIT_AUTHOR_EMAIL, value: "hermes@dsm-shai.invalid"}
            - {name: GIT_COMMITTER_EMAIL, value: "hermes@dsm-shai.invalid"}
            - {name: GIT_CONFIG_COUNT, value: "1"}
            - {name: GIT_CONFIG_KEY_0, value: "credential.https://github.com.helper"}
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
            - name: NO_PROXY
              value: ".svc,.cluster.local,localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16"
            - name: no_proxy
              value: ".svc,.cluster.local,localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16"
          envFrom:
            - configMapRef:
                name: nightly-specter-env       # NIGHTLY_REPO and the job limits; repo is empty until configured
                optional: true
            - configMapRef:
                name: maintainer-env            # spec 16: MAINT_ALLOWED_REPOS and defaults (observe mode)
                optional: true
            - configMapRef:
                name: swarm-env                 # spec 13: SWARM_ALLOWED_REPOS (fail closed when empty) and SWARM_HAIKU_PARALLEL
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: nightly-jobs
              mountPath: /opt/jobs/nightly-specter
              readOnly: true
            - name: claude-haiku-job
              mountPath: /opt/jobs/claude-haiku
              readOnly: true
            - {name: swarm-job, mountPath: /opt/jobs/swarm, readOnly: true}
            - {name: swarm-example-job, mountPath: /opt/jobs/swarm-example, readOnly: true}
            - {name: swarm-template-job, mountPath: /opt/jobs/swarm-template, readOnly: true}
            - {name: swarm-repo-work-job, mountPath: /opt/jobs/swarm-repo-work, readOnly: true}
            - {name: repo-maintainer-job, mountPath: /opt/jobs/repo-maintainer, readOnly: true}
        - name: metrics                         # spec 11: serves /opt/data/nightly-specter/metrics.prom on 9101, read-only
          image: docker.io/nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          imagePullPolicy: IfNotPresent
          command: ["python3", "-I", "/opt/jobs/nightly-specter/metrics_exporter.py"]
          ports:
            - {name: metrics, containerPort: 9101}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: home, mountPath: /opt/data, readOnly: true}
            - {name: nightly-jobs, mountPath: /opt/jobs/nightly-specter, readOnly: true}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: hermes-home
        - name: config
          configMap:
            name: hermes-config
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp                            # Node compile cache, uv locks, runtime scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: claude-haiku-job               # spec 12 wrapper, read-only
          configMap:
            name: hermes-claude-haiku
            defaultMode: 0555
        - name: swarm-job                      # spec 13 engine, read-only; prompts are mapped into prompts/
          configMap:
            name: hermes-swarm
            defaultMode: 0555
            items:
              - {key: swarm.py, path: swarm.py}
              - {key: lib.py, path: lib.py}
              - {key: route.py, path: route.py}
              - {key: verifiers.py, path: verifiers.py}
              - {key: workers.py, path: workers.py}
              - {key: repo_work.py, path: repo_work.py}
              - {key: pick_task.py, path: pick_task.py}
              - {key: run.sh, path: run.sh}
              - {key: prompt-plan, path: prompts/plan.v1.txt}
              - {key: prompt-worker, path: prompts/worker.v1.txt}
        - name: swarm-example-job              # spec 13 example job (runnable instance of the template)
          configMap:
            name: hermes-swarm
            defaultMode: 0555
            items:
              - {key: example-task, path: task.yaml}
              - {key: example-run, path: run.sh}
              - {key: example-register, path: register-cron.sh}
        - name: repo-maintainer-job            # spec 16 repo maintainer (observe mode until a reviewed PR raises it)
          configMap:
            name: hermes-repo-maintainer
            defaultMode: 0555
            items:
              - {key: maintain.py, path: maintain.py}
              - {key: run.sh, path: run.sh}
              - {key: register-cron.sh, path: register-cron.sh}
              - {key: repos.yaml, path: repos.yaml}
              - {key: prompt-review, path: prompts/review.v1.txt}
        - name: swarm-repo-work-job            # spec 14 autonomous repo work job (paused until SWARM_REPO_WORK=1)
          configMap:
            name: hermes-swarm
            defaultMode: 0555
            items:
              - {key: repowork-task, path: task.yaml}
              - {key: repowork-run, path: run.sh}
              - {key: repowork-register, path: register-cron.sh}
        - name: swarm-template-job             # spec 13 template for new jobs
          configMap:
            name: hermes-swarm
            defaultMode: 0555
            items:
              - {key: template-task, path: task.example.yaml}
              - {key: template-run, path: run.sh}
              - {key: template-register, path: register-cron.sh}
        - name: nightly-jobs                   # spec 11 job scripts, read-only; prompts are mapped into prompts/
          configMap:
            name: hermes-nightly-specter
            defaultMode: 0555
            items:
              - {key: run.sh, path: run.sh}
              - {key: orchestrate.py, path: orchestrate.py}
              - {key: lib.py, path: lib.py}
              - {key: select_mode.py, path: select_mode.py}
              - {key: guard.py, path: guard.py}
              - {key: dedupe.py, path: dedupe.py}
              - {key: inventory.py, path: inventory.py}
              - {key: specutil.py, path: specutil.py}
              - {key: gh_api.py, path: gh_api.py}
              - {key: metrics_exporter.py, path: metrics_exporter.py}
              - {key: validate.sh, path: validate.sh}
              - {key: register-cron.sh, path: register-cron.sh}
              - {key: prompt-a-summarise, path: prompts/a-summarise.v1.txt}
              - {key: prompt-a-vectors, path: prompts/a-vectors.v1.txt}
              - {key: prompt-a-spec, path: prompts/a-spec.v1.txt}
              - {key: prompt-b-implement, path: prompts/b-implement.v1.txt}
