# Default-deny egress for Hermes (spec 04 / spec 08). Allowed: cluster DNS, LiteLLM, OpenViking, and the
# ambient HBONE tunnel (15008) that carries mesh traffic. Everything else, including the public internet, is refused.
# Hostname allowlisting is not possible at this layer; the nightly job (spec 11) reaches GitHub through the proxy in
# namespace egress-proxy (port 3128), which allows five GitHub hosts only. See deploy/hermes/README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-egress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: litellm}
      ports:
        - {protocol: TCP, port: 4000}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openviking}
      ports:
        - {protocol: TCP, port: 1933}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: egress-proxy}
      ports:
        - {protocol: TCP, port: 3128}   # spec 11: the restricted proxy listener (GitHub, Anthropic, Discord); pod-wide default
        - {protocol: TCP, port: 3129}   # spec 15: the open-web research listener, used by claude-haiku.sh with CLAUDE_HAIKU_WEB=1
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 15008}
