# Default-deny egress for Hermes (spec 04 / spec 08). Allowed: cluster DNS, LiteLLM, OpenViking, and the
# ambient HBONE tunnel (15008) that carries mesh traffic. Everything else, including the public internet, is refused.
# Hostname allowlisting is not possible at this layer; see deploy/hermes/README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-egress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: litellm}
      ports:
        - {protocol: TCP, port: 4000}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openviking}
      ports:
        - {protocol: TCP, port: 1933}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 15008}
