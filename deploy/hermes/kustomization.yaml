apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - hermes.yaml
  - egress-networkpolicy.yaml
  - metrics-service.yaml
  - maintainer-cronjob.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
      # SOUL.md is copied into /opt/data by the seed-config init container on every start (the repo is the source of truth).
      - SOUL.md
  # Custom skills (2026-11-25), copied into /opt/data/skills/custom by seed-config. Keys are <skill>/SKILL.md paths.
  - name: hermes-skills
    files:
      - repo-review=skills/repo-review/SKILL.md
      - openviking-memory=skills/openviking-memory/SKILL.md
  # OpenViking link watch (2026-11-25): a no-agent cron script at /opt/jobs/openviking-watch. Tests stay out.
  - name: hermes-openviking-watch
    files:
      - watch.py=jobs/openviking-watch/watch.py
      - register-cron.sh=jobs/openviking-watch/register-cron.sh
  # Spec 11 nightly job: scripts and prompts, mounted read-only at /opt/jobs/nightly-specter. Tests stay out.
  - name: hermes-nightly-specter
    files:
      - run.sh=jobs/nightly-specter/run.sh
      - orchestrate.py=jobs/nightly-specter/orchestrate.py
      - lib.py=jobs/nightly-specter/lib.py
      - select_mode.py=jobs/nightly-specter/select_mode.py
      - guard.py=jobs/nightly-specter/guard.py
      - dedupe.py=jobs/nightly-specter/dedupe.py
      - inventory.py=jobs/nightly-specter/inventory.py
      - specutil.py=jobs/nightly-specter/specutil.py
      - gh_api.py=jobs/nightly-specter/gh_api.py
      - metrics_exporter.py=jobs/nightly-specter/metrics_exporter.py
      - validate.sh=jobs/nightly-specter/validate.sh
      - register-cron.sh=jobs/nightly-specter/register-cron.sh
      - prompt-a-summarise=jobs/nightly-specter/prompts/a-summarise.v1.txt
      - prompt-a-vectors=jobs/nightly-specter/prompts/a-vectors.v1.txt
      - prompt-a-spec=jobs/nightly-specter/prompts/a-spec.v1.txt
      - prompt-b-implement=jobs/nightly-specter/prompts/b-implement.v1.txt
  # Spec 13 swarm: engine and prompts at /opt/jobs/swarm, the example job at /opt/jobs/swarm-example, the template at
  # /opt/jobs/swarm-template (all read-only). Tests stay out.
  - name: hermes-swarm
    files:
      - swarm.py=jobs/swarm/swarm.py
      - lib.py=jobs/swarm/lib.py
      - route.py=jobs/swarm/route.py
      - verifiers.py=jobs/swarm/verifiers.py
      - workers.py=jobs/swarm/workers.py
      - repo_work.py=jobs/swarm/repo_work.py
      - pick_task.py=jobs/swarm/pick_task.py
      - run.sh=jobs/swarm/run.sh
      - prompt-plan=jobs/swarm/prompts/plan.v1.txt
      - prompt-worker=jobs/swarm/prompts/worker.v1.txt
      - example-task=jobs/swarm-example/task.yaml
      - example-run=jobs/swarm-example/run.sh
      - example-register=jobs/swarm-example/register-cron.sh
      - template-task=jobs/swarm-template/task.example.yaml
      - template-run=jobs/swarm-template/run.sh
      - template-register=jobs/swarm-template/register-cron.sh
      - repowork-task=jobs/swarm-repo-work/task.yaml
      - repowork-run=jobs/swarm-repo-work/run.sh
      - repowork-register=jobs/swarm-repo-work/register-cron.sh
  # Spec 16 repo maintainer: scripts at /opt/jobs/repo-maintainer (read-only). repos.yaml lists the repositories it looks after.
  - name: hermes-repo-maintainer
    files:
      - maintain.py=jobs/repo-maintainer/maintain.py
      - run.sh=jobs/repo-maintainer/run.sh
      - repos.yaml=jobs/repo-maintainer/repos.yaml
      - prompt-review=jobs/repo-maintainer/prompts/review.v1.txt
  # Spec 16 settings. Both allowlists must name a repo (and SWARM_ALLOWED_REPOS in swarm-env) or it is refused.
  - name: maintainer-env
    literals:
      - MAINT_ALLOWED_REPOS=dsm0014/dsm-shai
      - MAINT_MODE_DEFAULT=observe
      - MAINT_REVIEWER=haiku
      # Default merge limits for every repo (repos.yaml overrides per repo). 100 a day, one per pass: a pass runs every 15 minutes.
      - MAINT_MAX_MERGES_PER_DAY=100
      - MAINT_MAX_MERGES_PER_RUN=1
  # Spec 13 settings. SWARM_ALLOWED_REPOS is the fail-closed repo allowlist (empty means every task is refused).
  - name: swarm-env
    literals:
      - SWARM_ALLOWED_REPOS=dsm0014/dsm-shai
      - SWARM_HAIKU_PARALLEL=2
      # Spec 14: the repo-work job does nothing unless this is 1. Flip it in a reviewed PR when you want it live.
      - SWARM_REPO_WORK=0
  # Spec 12: Claude Haiku through the Claude Code CLI (subscription), mounted read-only at /opt/jobs/claude-haiku.
  - name: hermes-claude-haiku
    files:
      - claude-haiku.sh=jobs/claude-haiku/claude-haiku.sh
  # Spec 11 settings. The job fails closed while NIGHTLY_REPO is empty or the token is missing. It points at the
  # private rehearsal copy dsm0014/claude-specter-auto; switch to the real repo only after the rehearsal passes.
  - name: nightly-specter-env
    literals:
      - NIGHTLY_REPO=dsm0014/claude-specter-auto
      # Isolation guard: the job refuses any NIGHTLY_REPO not listed here. Go-live adds dsm0014/claude-specter in the same PR.
      - NIGHTLY_ALLOWED_REPOS=dsm0014/claude-specter-auto
      - NIGHTLY_TOKEN_TYPE=fine-grained
      - IMPL_PROBATION_NIGHTS=1
      - NIGHTLY_MAX_LINES=400
      - NIGHTLY_MAX_FILES=12
      - NIGHTLY_MAX_REPOS=5
      - NIGHTLY_MAX_SPECS=3
      - NIGHTLY_WALL_SECONDS=5400
