# Hermes config (spec 04). The ConfigMap is the source of truth: an init container copies it into
# HERMES_HOME (/opt/data) on every start. Keep context_length equal to OLLAMA_CONTEXT_LENGTH (spec 02).
model:
  default: "chat"                                # LiteLLM alias -> qwen3:14b
  provider: "custom"                             # any OpenAI-compatible endpoint
  base_url: "http://litellm.litellm.svc:4000/v1" # the only model route (no direct Ollama)
  context_length: 32768
  streaming: true
