# Hermes config (spec 04). The ConfigMap is the source of truth: an init container copies it into
# HERMES_HOME (/opt/data) on every start. Keep context_length equal to OLLAMA_CONTEXT_LENGTH (spec 02).
model:
  default: "chat"                                # LiteLLM alias -> ministral-3:14b (alias name stays "chat": Hermes tunes prompts by model name)
  provider: "custom"                             # any OpenAI-compatible endpoint
  base_url: "http://litellm.litellm.svc:4000/v1" # the only model route (no direct Ollama)
  key_env: "LITELLM_HERMES_KEY"                  # env var holding the LiteLLM virtual key (hermes)
  context_length: 65536                          # = OLLAMA_CONTEXT_LENGTH; Hermes floor is 64K
  streaming: false                               # the LiteLLM tool-call hook (ministral_tools.py) only runs on non-streamed replies

# Agent behaviour. ministral-3:14b has no thinking mode: any reasoning_effort except "none" is rejected with HTTP 400
# ("does not support thinking"). (qwen3.5:9b, the previous model, needed thinking ON and "medium".)
# The built-in memory toolset is disabled so that OpenViking is the only memory backend (spec 04).
# Tool Search (deferred tools behind bridge tools) stays off: the bridge calls were unreliable with llama3.1:8b
# (malformed tool_call wrappers). Not yet retested with qwen3.5:9b. Tools are sent with their real names.
tools:
  tool_search:
    enabled: "off"

agent:
  reasoning_effort: "none"
  # Hermes adopts a "coding agent" persona ("make changes through the tools, not the chat") on CLI surfaces when the
  # working directory looks like a code project (/opt/hermes has a pyproject.toml). `kubectl exec ... hermes` is such a
  # surface, so plain questions were answered with tool calls. This is not a coding workspace: turn it off.
  coding_context: "off"
  # "web" is off: its search and scrape backends are cloud APIs (Parallel, Firecrawl) that need API keys and are denied by
  # the egress proxy, so every web turn failed. Hermes reaches GitHub with the terminal tool (curl, git) through the proxy.
  # "browser" is off too: no browser backend is deployed (spec 09 deploy/browser/ is pending), so its tools only error.
  disabled_toolsets: ["memory", "web", "browser"]

# The image's working directory (/opt/hermes) is read-only, so git clone/checkout there failed. Start in /workspace
# (emptyDir, writable) instead.
terminal:
  cwd: "/workspace"

# OpenViking as memory/knowledge backend over MCP (spec 04). Direct to OpenViking for now: the LiteLLM MCP
# gateway registration (spec 09) is not yet in place. Key is the tenant user key for account "hermes".
mcp_servers:
  openviking:
    url: "http://openviking.openviking.svc:1933/mcp"
    headers:
      X-API-Key: "${OPENVIKING_KEY}"
    tools:
      # search is exposed again (2026-11-25). Its conditional parameter (detail needs mode=context) is documented in the
      # openviking-memory skill. Re-test on ministral-3:14b after this change; if the model still gets it wrong, remove
      # "search" here and the skill's search section stays as a reference only.
      include: ["find", "remember", "read", "list", "search"]
