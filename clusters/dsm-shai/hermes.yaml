# Stage "hermes": Hermes Agent (spec 04). Needs LiteLLM, its secrets and the mesh.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/hermes
  prune: true
  wait: false
  timeout: 10m0s
  retryInterval: 2m0s
  dependsOn:
    - name: litellm
    - name: openviking
    - name: secrets
    - name: egress
  sourceRef:
    kind: GitRepository
    name: flux-system
