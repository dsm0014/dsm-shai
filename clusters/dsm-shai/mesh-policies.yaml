# Stage "mesh-policies" (spec 08 part B): identity-based AuthorizationPolicies and STRICT mTLS, applied last.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mesh-policies
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/istio/policies
  prune: true
  wait: false
  timeout: 5m0s
  retryInterval: 2m0s
  dependsOn:
    - name: istio
    - name: litellm
    - name: openviking
    - name: inference
  sourceRef:
    kind: GitRepository
    name: flux-system
