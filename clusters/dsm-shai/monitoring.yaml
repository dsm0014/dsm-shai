# Stage 3 (spec 06 part A): kube-prometheus-stack. Gated on secrets so the Grafana admin Secret is decrypted.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/monitoring
  prune: true
  wait: true
  timeout: 15m0s
  retryInterval: 2m0s
  dependsOn:
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
