# Stage "monitoring-extras" (spec 06 part B): Grafana dashboards, alert rules and the host-local Grafana route.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-extras
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/monitoring/extras
  prune: true
  wait: false
  timeout: 5m0s
  retryInterval: 2m0s
  dependsOn:
    - name: monitoring
    - name: istio
  sourceRef:
    kind: GitRepository
    name: flux-system
