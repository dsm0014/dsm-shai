# Stage 2 "data" (spec 07 part A / spec 10): SOPS-encrypted Secrets, decrypted in-cluster with the sops-age key.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/secrets
  prune: true
  wait: true
  timeout: 5m0s
  retryInterval: 2m0s
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
