# Stage "open-webui": Open WebUI (spec 05). Needs LiteLLM, its secrets and the mesh.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/open-webui
  prune: true
  wait: false
  timeout: 10m0s
  retryInterval: 2m0s
  dependsOn:
    - name: litellm
    - name: istio
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
